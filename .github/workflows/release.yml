name: Release

# A tag like v0.3.0 builds the Linux AppImage, the Windows zip and the macOS
# disk image and
# attaches them to that tag's GitHub release (created if needed). Changes to
# the packaging build them too, without releasing, so a broken package shows
# up before the tag.
on:
  push:
    tags: ["v*"]
    branches: ["**"]
    paths:
      - .github/workflows/release.yml
      - scripts/build-appimage.sh
      - scripts/build-windows.sh
      - scripts/build-macos-app.sh
      - packaging/**
  workflow_dispatch:
    inputs:
      release:
        description: Attach the AppImage, the Windows zip and the disk image to this existing release tag (e.g. v0.2.1)
        required: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  appimage:
    # The oldest supported Ubuntu: the AppImage runs on its glibc and newer.
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake clang pkg-config libpulse-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev \
            libxcb1-dev libfontconfig-dev libfreetype-dev libasound2-dev libzstd-dev
      # Ubuntu 22.04 has no glslc and too old Vulkan headers for whisper.cpp;
      # the LunarG SDK brings both (the AppImage uses the system's loader).
      - name: Vulkan SDK
        env:
          VK: 1.4.309.0
        run: |
          curl -fsSL "https://sdk.lunarg.com/sdk/download/$VK/linux/vulkansdk-linux-x86_64-$VK.tar.xz" | tar -xJ -C "$HOME"
          echo "VULKAN_SDK=$HOME/$VK/x86_64" >> "$GITHUB_ENV"
          echo "$HOME/$VK/x86_64/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$HOME/$VK/x86_64/lib" >> "$GITHUB_ENV"
          echo "RUSTFLAGS=-L native=$HOME/$VK/x86_64/lib" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          key: appimage
          cache-directories: ~/.cache/sherpa-rs
      - run: ./scripts/build-appimage.sh
      - name: Smoke test
        run: |
          app=dist/Mostalgia-x86_64.AppImage
          "$app" --appimage-extract-and-run help
          "$app" --appimage-extract-and-run download-models --list | tee models.txt
      # The first-launch download depends on these links; check they work.
      - name: Model links
        run: |
          grep -o 'https://[^ ]*' models.txt | while read -r url; do
            curl -fsSIL -o /dev/null "$url" || { echo "broken: $url"; exit 1; }
            echo "ok  $url"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: Mostalgia-x86_64.AppImage
          path: dist/*
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release || github.ref_name }}
          files: dist/*
          generate_release_notes: true

  # Mostalgia.app in a disk image, for Apple Silicon (Metal). Ad-hoc signed:
  # macOS asks to confirm the first start (right-click → Open, or System
  # Settings → Privacy & Security → "Open Anyway").
  #
  # Optional Developer ID signing and notarization, which removes that step,
  # runs only when these repository secrets exist (an Apple Developer
  # account is needed for them):
  #   MACOS_CERTIFICATE           base64 of the "Developer ID Application" .p12
  #   MACOS_CERTIFICATE_PASSWORD  its password
  #   MACOS_NOTARY_APPLE_ID       Apple ID for notarization
  #   MACOS_NOTARY_TEAM_ID        the team id
  #   MACOS_NOTARY_PASSWORD       an app-specific password of that Apple ID
  dmg:
    runs-on: macos-14
    permissions:
      contents: write
    env:
      HAS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE != '' }}
      HAS_NOTARY: ${{ secrets.MACOS_NOTARY_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: dmg
          cache-directories: ~/Library/Caches/sherpa-rs
      - name: Signing certificate
        if: env.HAS_CERTIFICATE == 'true'
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(uuidgen)
          echo "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity=$(security find-identity -v -p codesigning "$keychain" | grep -o '"Developer ID Application[^"]*"' | head -1 | tr -d '"')
          [[ -n "$identity" ]] || { echo "no Developer ID Application identity in the certificate"; exit 1; }
          echo "MACOS_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
      - run: ./scripts/build-macos-app.sh
      - name: Smoke test
        run: |
          app=dist/Mostalgia.app/Contents/MacOS
          "$app/mostalgia" help
          "$app/mostalgia" download-models --list
      - name: Notarize
        if: env.HAS_CERTIFICATE == 'true' && env.HAS_NOTARY == 'true'
        env:
          APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: |
          dmg=$(ls dist/*.dmg)
          xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --team-id "$TEAM_ID" --password "$PASSWORD" --wait
          xcrun stapler staple "$dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: Mostalgia-macOS-arm64.dmg
          path: dist/*.dmg
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release || github.ref_name }}
          files: dist/*.dmg

  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Whisper on the GPU needs the Vulkan SDK (headers, glslc, the import
      # library) to build; users only need their GPU driver. If installing
      # it fails, the zip is the CPU build instead of no zip at all.
      - name: Vulkan SDK
        id: vulkan
        continue-on-error: true
        env:
          VK: 1.4.309.0
        run: |
          curl -fsSL -o vksdk.exe "https://sdk.lunarg.com/sdk/download/$VK/windows/VulkanSDK-$VK-Installer.exe"
          ./vksdk.exe --root "C:\\VulkanSDK\\$VK" --accept-licenses --default-answer --confirm-command install
          test -f "/c/VulkanSDK/$VK/Bin/glslc.exe"
          echo "VULKAN_SDK=C:\\VulkanSDK\\$VK" >> "$GITHUB_ENV"
          echo "/c/VulkanSDK/$VK/Bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-release
          cache-directories: ~/AppData/Local/sherpa-rs
      - run: bash scripts/build-windows.sh
      - name: Smoke test
        run: |
          rm -rf smoke && mkdir smoke && cd smoke
          7z x ../dist/Mostalgia-windows-x86_64.zip >/dev/null
          ./Mostalgia/mostalgia.exe help
          ./Mostalgia/mostalgia.exe download-models --list
      - uses: actions/upload-artifact@v4
        with:
          name: Mostalgia-windows-x86_64
          path: dist/*
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release || github.ref_name }}
          files: dist/*
