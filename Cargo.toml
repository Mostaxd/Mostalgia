[workspace]
resolver = "3"
members = ["crates/mostalgia-core", "crates/mostalgia-cli", "crates/mostalgia-app"]

[workspace.package]
version = "0.2.9"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Mostaxd/Mostalgia"

[profile.release]
lto = "thin"

# gpui-component with the Linux window shadow margin removed (see
# vendor/gpui-component/src/window_border.rs, "Mostalgia:").
[patch.crates-io]
gpui-component = { path = "vendor/gpui-component" }
